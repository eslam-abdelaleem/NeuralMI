name: Bug report
description: Something behaved differently from what the documentation says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If the library printed a message you did not expect, check
        `reference/MESSAGES.md` first. It is keyed by the text of every message
        the library can emit and says what each one means.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [estimate, sweep, rigorous, lag, precision, conditional, transfer, interaction, pairwise, dimensionality, "not sure"]
    validations:
      required: true
  - type: textarea
    id: call
    attributes:
      label: The call
      description: The `nmi.run()` call, including the config objects you passed.
      render: python
    validations:
      required: true
  - type: textarea
    id: shapes
    attributes:
      label: Data shapes and types
      description: |
        Shape and dtype of each array, and the processor type for each side.
        For spike data, say whether you passed times or an already-binned tensor.
      placeholder: |
        x_data: (12000, 32) float32, processor_type='continuous'
        y_data: list of 40 arrays of spike times, processor_type='spike'
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Result
      description: |
        `result.summary()` and `print(result.runs)` if the run completed. The
        saturation columns, `best_epoch` and `amplification_factor` usually
        decide whether a number can be read.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: "`python -c \"import neural_mi; print(neural_mi.__version__, neural_mi.__file__)\"`"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python, torch and OS
