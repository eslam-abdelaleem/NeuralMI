name: Run Python Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and the test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Test with pytest
        run: pytest

  floors:
    # Every dependency at the lowest version pyproject.toml allows, on the
    # oldest supported Python, so the stated floors stay true as the code changes.
    name: Tests at the dependency floors
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pin every dependency at its floor
        run: |
          python - <<'PY'
          import re
          import tomllib

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          extras = project["optional-dependencies"]
          with open("floors.txt", "w") as out:
              for requirement in project["dependencies"] + extras["viz"] + extras["vision"]:
                  name, floor = re.fullmatch(r"([A-Za-z0-9_.-]+)>=([0-9][0-9A-Za-z.]*)",
                                             requirement).groups()
                  out.write(f"{name}=={floor}\n")
          PY
          cat floors.txt

      - name: Install the package and the test dependencies at the floors
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]" -c floors.txt

      - name: Test with pytest
        run: pytest
