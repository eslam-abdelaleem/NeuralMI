[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Run tests in parallel across all cores by default (pytest-xdist). The suite is
# training-bound, so this cuts wall time several-fold with no change to what is
# tested. Pass "-n0" to disable (e.g. for pdb debugging): pytest -n0 -v
addopts = -n auto --tb=short
# Registered markers. "slow" tags the handful of accuracy runs that need real
# convergence; under -n auto they set the floor on wall time, so
# `pytest -m "not slow"` is the fast path.
markers =
    slow: needs real convergence to assert anything, and dominates wall time
