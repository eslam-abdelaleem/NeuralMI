[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural_mi"
version = "1.0.0"
description = "A Python toolbox for rigorous mutual information estimation in neuroscience"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Eslam Abdelaleem" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.23.0",
    "pandas>=1.4.0",
    "scipy>=1.9.0",
    "seaborn>=0.12.0",
    "statsmodels>=0.13.0",
    "torch>=2.0.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
# Each option adds one capability, and options combine, as in ".[viz,tutorials]".
#
# PCA, t-SNE and UMAP projections of the learned embeddings. neural_mi.visualize
# imports both packages only when one of those plots is drawn.
viz = [
    "scikit-learn>=1.0.0",
    "umap-learn>=0.5.0",
]
# Pretrained image networks as encoders (embedding_model='pretrained_backbone').
vision = ["torchvision>=0.15.0"]
# Running the tutorial notebooks. benchmark-mi provides the KSG estimator that
# notebook 01 compares against, and it brings in JAX, a large install.
tutorials = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0.0",
    "benchmark-mi>=0.1.3",
]
# Building the documentation site. nbsphinx also needs pandoc, which comes from
# the system package manager (brew install pandoc, apt install pandoc).
docs = [
    "sphinx>=7.2,<8.0",
    "sphinx-rtd-theme>=2.0,<3.0",
    "sphinx-copybutton>=0.5,<0.6",
    "myst-parser>=2.0,<3.0",
    "nbsphinx>=0.9.3,<0.10",
    "nbsphinx-link>=1.3,<2.0",
    "linkify-it-py>=2.0",
]
# Running the test suite, with the optional packages its tests exercise.
test = [
    "neural_mi[viz,vision]",
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-xdist>=3.0.0",
]
# Everything above, for working on the library: pip install -e ".[dev]"
dev = [
    "neural_mi[test,tutorials,docs]",
]

[project.urls]
Homepage = "https://github.com/eslam-abdelaleem/NeuralMI"
Documentation = "https://eslam-abdelaleem.github.io/NeuralMI/"
Repository = "https://github.com/eslam-abdelaleem/NeuralMI"
Issues = "https://github.com/eslam-abdelaleem/NeuralMI/issues"
Changelog = "https://github.com/eslam-abdelaleem/NeuralMI/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["neural_mi*"]

[tool.setuptools.package-data]
neural_mi = ["py.typed"]
